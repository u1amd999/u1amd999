name: Generate Projects Panel

on:
  push:
    branches: [main]
    paths:
      - "projects.json"
      - "logos/**"
      - ".github/scripts/generate_projects.py"
      - ".github/scripts/fetch_data.py"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live repo data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/fetch_data.py

      - name: Generate projects.svg
        run: |
          mkdir -p out
          python3 .github/scripts/generate_projects.py merged.json out

      - name: Push to projects branch
        run: |
          cd out
          git init
          git config user.name "u1"
          git config user.email "u1.999@proton.me"
          git add -A
          git commit -m "Update projects panel [skip ci]" || true
          git branch -M projects
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/u1amd999/u1amd999.git" projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
